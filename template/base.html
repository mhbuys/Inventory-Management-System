<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Inventory Management System{% endblock %}</title>
        <style>
            /* ### Design: small, self-contained starter styles for this first page. */
            /* ### Design: shared colors make future theme changes easier. */
            :root {
                --ink: #24313b;
                --muted: #6d7a83;
                --line: #dbe3e6;
                --paper: #f7faf9;
                --surface: #ffffff;
                --accent: #216e68;
                --accent-dark: #174d4a;
                --danger: #a84848;
            }

            /* ### Design: use predictable sizing for every element. */
            * { box-sizing: border-box; }

            /* ### Design: establish the page canvas and readable default type. */
            body {
                min-height: 100vh;
                margin: 0;
                color: var(--ink);
                background: var(--paper);
                font-family: Georgia, "Times New Roman", serif;
            }

            /* ### Design: keep controls consistent with the page typography. */
            button, input { font: inherit; }

            /* ### Design: the banner keeps navigation visible across the site. */
            .top-banner {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                padding: 1rem clamp(1rem, 4vw, 4rem);
                color: #ffffff;
                background: var(--accent-dark);
            }

            /* ### Design: group banner branding and action controls. */
            .brand { margin: 0; font-size: 1.25rem; letter-spacing: .02em; }
            .banner-actions, .item-actions { display: flex; flex-wrap: wrap; gap: .6rem; }

            /* ### Design: shared button styling supports links and form buttons. */
            .button {
                display: inline-block;
                border: 1px solid transparent;
                border-radius: 4px;
                padding: .6rem .85rem;
                color: var(--ink);
                background: var(--surface);
                cursor: pointer;
                text-decoration: none;
                font-size: .92rem;
            }

            /* ### Design: color variants separate primary, destructive, and quiet actions. */
            .button:hover, .button:focus-visible { border-color: #8eb8b1; }
            .button:disabled {
                cursor: not-allowed;
                opacity: .45;
            }
            .button-primary { color: #ffffff; background: var(--accent); }
            .button-danger { color: #ffffff; background: var(--danger); }
            .button-quiet { color: #ffffff; background: transparent; border-color: #8db2ae; }
            .status-low {
                color: var(--danger);
                font-weight: 700;
                text-decoration: none;
            }
            .status-low:hover, .status-low:focus-visible { text-decoration: underline; }

            .quantity-dialog[hidden] { display: none; }
            .quantity-dialog {
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                padding: 1rem;
                background: rgba(36, 49, 59, .45);
            }
            .quantity-dialog-panel {
                width: min(100%, 24rem);
                padding: 1.5rem;
                background: var(--surface);
                box-shadow: 0 16px 40px rgba(36, 49, 59, .2);
            }
            .quantity-dialog-panel h2 { margin-bottom: .5rem; }
            .quantity-dialog-panel label {
                display: block;
                margin-bottom: .35rem;
                font-weight: 700;
            }
            .quantity-dialog-panel input {
                width: 100%;
                margin-bottom: 1rem;
                border: 1px solid var(--line);
                padding: .65rem;
            }
            .quantity-dialog-panel .item-actions { justify-content: flex-end; }
            .quantity-dialog-panel .button-quiet {
                color: var(--ink);
                border-color: var(--line);
            }

            /* ### Design: keep the inventory view focused on daily stock work. */
            .page-shell {
                width: min(1180px, calc(100% - 2rem));
                margin: 0 auto;
                padding: clamp(2rem, 6vw, 5rem) 0;
            }

            /* ### Design: small labels provide hierarchy above major headings. */
            .eyebrow {
                margin: 0 0 .45rem;
                color: var(--accent);
                font: 700 .75rem/1.2 Arial, sans-serif;
                letter-spacing: .14em;
                text-transform: uppercase;
            }

            /* ### Design: keep headings compact and supporting text subdued. */
            h1, h2, p { margin-top: 0; }
            h1 { margin-bottom: .65rem; font-size: clamp(2rem, 4vw, 3.5rem); line-height: 1; }
            h2 { margin-bottom: .35rem; font-size: 1.5rem; }
            .muted { color: var(--muted); }

            /* ### Design: panels frame the inventory workspace without heavy decoration. */
            .inventory-panel {
                border-top: 4px solid var(--accent);
                padding: 1.5rem;
                background: var(--surface);
                box-shadow: 0 12px 30px rgba(36, 49, 59, .07);
            }

            /* ### Design: inventory heading balances title information and item count. */
            .inventory-heading {
                display: flex;
                align-items: end;
                justify-content: space-between;
                gap: 1rem;
                margin-bottom: 1.5rem;
            }

            /* ### Design: rows make item names, details, and actions easy to scan. */
            .inventory-list { border-top: 1px solid var(--line); }
            .inventory-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                padding: 1rem 0;
                border-bottom: 1px solid var(--line);
            }

            .inventory-row strong { display: block; margin-bottom: .25rem; }
            .status { color: var(--accent); font: 700 .75rem Arial, sans-serif; text-transform: uppercase; }

            /* ### Design: stack content on smaller screens to prevent cramped controls. */
            @media (max-width: 760px) {
                .top-banner, .inventory-heading, .inventory-row { align-items: stretch; flex-direction: column; }
                .page-shell { grid-template-columns: 1fr; padding-top: 2rem; }
                .banner-actions, .item-actions { width: 100%; }
                .banner-actions .button, .item-actions .button { flex: 1; text-align: center; }
            }
        </style>
    </head>
    <body>
        {% block content %}{% endblock %}
    </body>
</html>
