<!DOCTYPE html>

<html lang="en">



<head>

    <meta charset="UTF-8">

    <title>Add Item</title>



    <style>

        body {

            margin: 0;

            background: #f7faf9;

            font-family: Georgia, "Times New Roman", serif;

        }



        header {

            background: #174d4a;

            color: white;

            padding: 1rem 2rem;

        }



        main {

            width: 600px;

            max-width: 90%;

            margin: 3rem auto;

            background: white;

            padding: 2rem;

        }



        label {

            font-weight: bold;

        }



        input {

            width: 100%;

            padding: 8px;

            margin-top: 5px;

            box-sizing: border-box;

        }



        button {

            padding: 10px 15px;

            background: #216e68;

            color: white;

            border: none;

        }



        a {

            margin-left: 10px;

        }

    </style>

</head>



<body>



<h



<header>

    <h2>Inventory Management System</h2>

</header>



<main>

    <h1>Add Item</h1>



    <form method="post">



        <p>

            <label>Item Name</label><br>

            <input type="text" name="name">

        </p>



        <p>

            <label>Category</label><br>

            <input type="text" name="category">

        </p>



        <p>

            <label>Description</label><br>

            <input type="text" name="description">

        </p>



        <p>

            <label>Price</label><br>

            <input type="number" name="price" step="0.01">

        </p>



        <p>

            <label>Quantity</label><br>

            <input type="number" name="quantity">

        </p>



        <button type="submit">Add Item</button>

        <a href="/">Cancel</a>



    </form>

</main>



</body>

</html>
