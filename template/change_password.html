<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Change password | Inventory Management System</title>
        <style>
            :root {
                --ink: #24313b;
                --muted: #6d7a83;
                --line: #dbe3e6;
                --paper: #f7faf9;
                --surface: #ffffff;
                --accent: #216e68;
                --accent-dark: #174d4a;
            }
            * { box-sizing: border-box; }
            body {
                min-height: 100vh;
                margin: 0;
                color: var(--ink);
                background: var(--paper);
                font-family: Georgia, "Times New Roman", serif;
            }
            button, input { font: inherit; }
            .login-page {
                display: grid;
                place-items: center;
                min-height: 100vh;
                padding: 2rem 1rem;
            }
            .login-form {
                width: min(420px, 100%);
                padding: clamp(2rem, 6vw, 3rem);
                background: var(--surface);
                border-top: 4px solid var(--accent);
                box-shadow: 0 18px 45px rgba(36, 49, 59, .1);
            }
            .eyebrow {
                margin: 0 0 .6rem;
                color: var(--accent);
                font: 700 .75rem/1.2 Arial, sans-serif;
                letter-spacing: .14em;
                text-transform: uppercase;
            }
            h2 { margin: 0 0 .35rem; font-size: 1.7rem; }
            .muted { color: var(--muted); line-height: 1.5; }
            label { display: block; margin: 1.15rem 0 .35rem; font: 700 .85rem Arial, sans-serif; }
            input {
                width: 100%;
                border: 1px solid var(--line);
                border-radius: 3px;
                padding: .75rem;
                color: var(--ink);
                background: #ffffff;
            }
            input:focus { outline: 2px solid #8eb8b1; outline-offset: 2px; }
            .button {
                width: 100%;
                margin-top: 1.35rem;
                border: 1px solid transparent;
                border-radius: 4px;
                padding: .7rem .85rem;
                color: #ffffff;
                background: var(--accent);
                cursor: pointer;
                font-size: .95rem;
            }
            .button:hover, .button:focus-visible { background: var(--accent-dark); }
        </style>
    </head>
    <body>
        <main class="login-page">
            <section class="login-form" aria-labelledby="change-password-title">
                <p class="eyebrow">Security</p>
                <h2 id="change-password-title">Set a new password</h2>
                <!-- Blocks the rest of the app until the seeded default password is replaced - NL -->
                <p class="muted">This account still uses its initial password. Choose a new one to continue.</p>
                {% if error %}
                <p class="muted" style="color: #a84848;">{{ error }}</p>
                {% endif %}
                <form action="{{ url_for('change_password') }}" method="post">
                    <label for="new_password">New password</label>
                    <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" required>
                    <label for="confirm_password">Confirm new password</label>
                    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
                    <button class="button" type="submit">Update password</button>
                </form>
            </section>
        </main>
    </body>
</html>
