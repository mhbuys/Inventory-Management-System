<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Remove Item</title>

    <style>
        body {
            margin: 0;
            background: #f7faf9;
            font-family: Georgia, "Times New Roman", serif;
        }

        header {
            background: #174d4a;
            color: white;
            padding: 1rem 2rem;
        }

        main {
            width: 600px;
            max-width: 90%;
            margin: 3rem auto;
            background: white;
            padding: 2rem;
        }

        label {
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .actions {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 1rem;
        }

        button {
            padding: 10px 15px;
            background: #216e68;
            color: white;
            border: none;
            cursor: pointer;
        }

        .danger {
            background: #b63a2d;
        }

        a {
            margin-left: 10px;
            color: inherit;
            text-decoration: none;
        }
    </style>
</head>

<body>

<!-- Shared application header identifies the inventory system. -->
<header>
    <h2>Inventory Management System</h2>
</header>

<!-- The form submits the selected product ID to Flask for deletion. -->
<main>
    <h1>Remove Item</h1>

    <form method="post">
        <p>
            <label for="product_id">Item</label><br>
            <select id="product_id" name="product_id" required>
                <!-- Flask fills these options from active database products. -->
                {% for item in items %}
                    <option value="{{ item['product_id'] }}">{{ item['name'] }}</option>
                {% endfor %}
            </select>
        </p>

        <div class="actions">
            <!-- The destructive action is visually separated from canceling. -->
            <button class="danger" type="submit">Remove</button>
            <a href="/">Cancel</a>
        </div>
    </form>
</main>

</body>
</html>
