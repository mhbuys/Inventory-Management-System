<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Log in | Inventory Management System</title>
        <style>
            /* Shared colors and surfaces for the login page. */
            :root {
                --ink: #24313b;
                --muted: #6d7a83;
                --line: #dbe3e6;
                --paper: #f7faf9;
                --surface: #ffffff;
                --accent: #216e68;
                --accent-dark: #174d4a;
            }

            * { box-sizing: border-box; }
            /* Keep the login screen centered within the full browser window. */
            body {
                min-height: 100vh;
                margin: 0;
                color: var(--ink);
                background: var(--paper);
                font-family: Georgia, "Times New Roman", serif;
            }
            button, input { font: inherit; }
            /* The two-column layout becomes a single column on small screens. */
            .login-page {
                display: grid;
                place-items: center;
                min-height: 100vh;
                padding: 2rem 1rem;
            }
            .login-layout {
                display: grid;
                grid-template-columns: minmax(220px, .8fr) minmax(280px, 420px);
                width: min(920px, 100%);
                background: var(--surface);
                box-shadow: 0 18px 45px rgba(36, 49, 59, .1);
            }
            .login-intro {
                padding: clamp(2rem, 6vw, 4rem);
                color: #ffffff;
                background: var(--accent-dark);
            }
            /* The form panel stays visually separate from the introduction panel. */
            .login-form {
                padding: clamp(2rem, 6vw, 4rem);
                border-top: 4px solid var(--accent);
            }
            .eyebrow {
                margin: 0 0 .6rem;
                color: var(--accent);
                font: 700 .75rem/1.2 Arial, sans-serif;
                letter-spacing: .14em;
                text-transform: uppercase;
            }
            .login-intro .eyebrow { color: #a9d1c9; }
            h1 { margin: 0 0 .8rem; font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1; }
            h2 { margin: 0 0 .35rem; font-size: 1.7rem; }
            p { margin-top: 0; }
            .muted { color: var(--muted); line-height: 1.5; }
            .login-intro .muted { color: #d7e5e2; }
            label { display: block; margin: 1.15rem 0 .35rem; font: 700 .85rem Arial, sans-serif; }
            input {
                width: 100%;
                border: 1px solid var(--line);
                border-radius: 3px;
                padding: .75rem;
                color: var(--ink);
                background: #ffffff;
            }
            input:focus { outline: 2px solid #8eb8b1; outline-offset: 2px; }
            .button {
                width: 100%;
                margin-top: 1.35rem;
                border: 1px solid transparent;
                border-radius: 4px;
                padding: .7rem .85rem;
                color: #ffffff;
                background: var(--accent);
                cursor: pointer;
                font-size: .95rem;
            }
            .button:hover, .button:focus-visible { background: var(--accent-dark); }
            .back-link {
                display: inline-block;
                margin-top: 1.25rem;
                color: var(--accent-dark);
                font: 700 .85rem Arial, sans-serif;
                text-decoration: none;
            }
            @media (max-width: 680px) {
                .login-layout { grid-template-columns: 1fr; }
                .login-intro { padding-bottom: 2.25rem; }
                .login-form { padding-top: 2.25rem; }
            }
        </style>
    </head>
    <body>
        <main class="login-page">
            <section class="login-layout" aria-labelledby="login-title">
                <!-- Brand message and short description for the inventory system. -->
                <div class="login-intro">
                    <p class="eyebrow">Inventory Management System</p>
                    <h1>Please log in to continue .</h1>
                    <p class="muted">A Placeholder.</p>
                </div>
                <!-- Auth form tied to the Flask login route. -->
                <div class="login-form">
                    <p class="eyebrow">Team access</p>
                    <h2 id="login-title">Welcome.</h2>
                    <p class="muted">Use your account details to continue.</p>
                    {% if error %}
                    <!-- Show a brief invalid-login message returned by the route. -->
                    <p class="muted" style="color: #a84848;">{{ error }}</p>
                    {% endif %}
                    {% if expired %}
                    <!-- Session timeout message shown when the 30-minute inactivity limit ends the login. -->
                    <p class="muted" style="color: #a84848;">Your session has expired. Please log in again.</p>
                    {% endif %}
                    <form action="{{ url_for('login') }}" method="post">
                        <!-- Username and password are posted to the Flask auth handler. -->
                        <label for="username">Username</label>
                        <input id="username" name="username" type="text" autocomplete="username" required>
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" autocomplete="current-password" required>
                        <button class="button" type="submit">Log in</button>
                    </form>
                    <!-- The return link keeps the basic page flow consistent. -->
                    <a class="back-link" href="{{ url_for('login_page') }}">Return to inventory preview</a>
                </div>
            </section>
        </main>
    </body>
</html>
